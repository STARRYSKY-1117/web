<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>注册</title>
</head>

<body class="loginBody">

    <main>
        <div class="search-wrapper">
            <div class="logoBox">
                <img src="./images/logo.jpg" alt="">
                <p class="logo"> 尽情热爱~</p>
            </div>
            <div class="search">
                <input type="text" value="" />
                <button type="button"><i></i><span>搜索</span></button>
            </div>
        </div>
        <div class="swipper">
            <ul class="imgList">
                <li class="imgList-item active"><img src="images/banner.jpg" alt=""></li>
            </ul>
        </div>
        <nav>
            <ul class="navMenu">
                <li>
                    <a href="index.html">首页</a>
                </li>
                <li>
                    <a href="about.html">新疆百科</a>
                </li>
                <li>
                    <a href="food.html">美食介绍</a>
                </li>
                <li>
                    <a href="custom.html">文化风俗</a>
                </li>
                <li><a href="contact.html">联系我们</a></li>
                <li><a href="login.html">登录</a></li>
                <li class="current"><a href="register.html">注册</a></li>
            </ul>
        </nav>
        <div class="content">
            <div class="container">
                <div class="register">
                    <h2>注 册</h2>
                    <form>
                        <input type="text" name="Name" placeholder="用户名" required="">
                        <input type="text" name="Email" placeholder="邮箱" required="">
                        <input type="password" name="Password" placeholder="密码" required="">
                        <input type="text" name="Phone Number" placeholder="手机号码" required="">
                    </form>
                    <div class="send-button">
                        <input type="submit" value="免费注册">
                    </div>
                </div>
            </div>
        </div>
        <footer>
            <p>CopyRight © 2025 ALL Rights</p>
            <p>中国省份介绍网站 |川ICP证00000</p>
        </footer>
    </main>
</body>
<script>
    // 获取表单元素
    const registerForm = document.querySelector('.register form');
    const nameInput = document.querySelector('input[name="Name"]');
    const emailInput = document.querySelector('input[name="Email"]');
    const passwordInput = document.querySelector('input[name="Password"]');
    const phoneInput = document.querySelector('input[name="Phone Number"]');
    const registerButton = document.querySelector('.send-button input[type="submit"]');

    // 表单提交事件处理函数
    const handleSubmit = (event) => {
        event.preventDefault(); // 阻止表单提交的默认行为

        // 校验用户名、邮箱、密码和手机号是否为空
        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        const phone = phoneInput.value.trim();

        if (name === '' || email === '' || password === '' || phone === '') {
            alert('用户名、邮箱、密码和手机号不能为空');
            return;
        }

        // 校验邮箱格式
        const emailRegex = /^\w+([-+.]\w+)*@\w+([-.]\w+)*\.\w+([-.]\w+)*$/;
        if (!emailRegex.test(email)) {
            alert('请输入有效的邮箱地址');
            return;
        }

        // 校验手机号格式
        const phoneRegex = /^1[3456789]\d{9}$/;
        if (!phoneRegex.test(phone)) {
            alert('请输入有效的手机号码');
            return;
        }

        // 表单校验通过，可以继续进行注册操作
        alert('注册成功！');
        // 可以在这里进行页面跳转或其他操作
        window.location.href = 'login.html'; // 跳转到 login.html
    };

    // 绑定表单提交事件
    registerForm.addEventListener('submit', handleSubmit);

    // 绑定点击事件
    registerButton.addEventListener('click', handleSubmit);

</script>

</html>
